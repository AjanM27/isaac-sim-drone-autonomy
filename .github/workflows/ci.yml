name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-and-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install -r requirements-dev.txt
      - name: Check shell syntax
        run: bash -n $(find scripts docker simulation/room_quadcopter -type f -name '*.sh' -print)
      - name: ShellCheck project entry points
        run: shellcheck -S warning scripts/*.sh docker/flight_control/*.sh docker/ros2/*.sh docker/slam/*.sh simulation/room_quadcopter/*.sh
      - name: Compile Python
        run: python -m compileall -q scripts docker/flight_control docker/slam/isaac_slam simulation/room_quadcopter/scripts
      - name: Check Python errors
        run: python -m ruff check --select F scripts docker/flight_control docker/slam/isaac_slam simulation/room_quadcopter/scripts
      - name: Validate asset manifest
        run: python scripts/validate_repository.py
      - name: Unit tests
        run: python -m unittest discover -s docker/flight_control -p 'test_*.py'
